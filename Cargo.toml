[package]
name = "devsweep"
version = "0.1.0"
edition = "2024"
description = "What your projects' build output is costing you, and cleaning it up"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
