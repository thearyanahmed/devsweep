name: Release

# Pushing a tag like v0.2.0, or running this workflow by hand from the Actions tab with that tag, builds devsweep
# for macOS and Linux, publishes a GitHub release with the changelog's notes for that version, and, when the
# HOMEBREW_TAP_TOKEN secret is set, updates the formula in thearyanahmed/homebrew-tap. Run by hand, the tag is
# created on the commit the workflow runs from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, like v0.2.0; must match the version in Cargo.toml"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml and has no release yet
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$TAG" = "v$version" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }
          ! gh release view "$TAG" >/dev/null 2>&1 || { echo "release $TAG already exists"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: check
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="devsweep-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/devsweep" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: devsweep-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update the tap
        if: env.TAP_TOKEN != ''
        run: |
          version="${TAG#v}"
          base="https://github.com/thearyanahmed/devsweep/releases/download/${TAG}"
          sha() { cut -d' ' -f1 "dist/devsweep-${TAG}-$1.tar.gz.sha256"; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/thearyanahmed/homebrew-tap" tap
          mkdir -p tap/Formula
          cat > tap/Formula/devsweep.rb <<EOF
          class Devsweep < Formula
            desc "Find and clean what's eating a developer's disk"
            homepage "https://github.com/thearyanahmed/devsweep"
            version "${version}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "${base}/devsweep-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/devsweep-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/devsweep-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${base}/devsweep-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "devsweep"
            end

            test do
              system bin/"devsweep", "-h"
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devsweep.rb
          git commit -m "devsweep ${version}"
          git push
